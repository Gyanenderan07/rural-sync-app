<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuralSync — System Control Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04060a;
            --card: rgba(13, 20, 35, 0.65);
            --border: rgba(255, 255, 255, 0.07);
            --text: #f1f5f9;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(120% 120% at 50% 10%, #0b0f19 0%, var(--bg) 100%);
            color: var(--text); padding: 40px; margin: 0;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .refresh-btn { background: linear-gradient(135deg, #0077ff 0%, #00ddff 100%); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 119, 255, 0.3); }
        .data-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; backdrop-filter: blur(16px); }
        th, td { padding: 18px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.02); font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
        td { font-size: 14px; }
        .mono { font-family: 'JetBrains Mono', monospace; color: #00ddff; font-size: 13px;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛰️ Centralized Cloud Data Sync Pipeline Monitor</h1>
        <button class="refresh-btn" onclick="fetchCloudData()">🔄 Fetch Live Server Data</button>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Transaction Payload ID</th>
                <th>Synchronized Report Data String</th>
                <th>Server Timestamp Log</th>
            </tr>
        </thead>
        <tbody id="database-rows">
            <tr>
                <td colspan="3" style="text-align: center; color: #94a3b8; padding: 40px; font-style: italic;">Click fetch button to query real-time data entries.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = "https://rsjyvrnxqkjtaczwectr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzanl2cm54cWtqdGFjendlY3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMDMwNjUsImV4cCI6MjA5Njg3OTA2NX0.YB63IkqX1Q5uFtNNxEjnyx-TFdCeN_U09vWM6zguL-o";

    async function fetchCloudData() {
        const tableBody = document.getElementById('database-rows');
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 40px;">Querying cloud ledger data tables...</td></tr>';
        
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/reportsStore?select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            });
            const data = await response.json();
            
            tableBody.innerHTML = '';
            if(data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color:#94a3b8; padding: 40px;">Database store is empty. No pipelines tracked yet.</td></tr>';
                return;
            }

            data.forEach(row => {
                tableBody.innerHTML += `<tr>
                    <td class="mono">${row.id}</td>
                    <td>${row.reportData}</td>
                    <td style="color:#10b981; font-weight:600;">${row.timestamp}</td>
                </tr>`;
            });
        } catch(err) {
            tableBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color:#ef4444; padding: 40px;">API Tracking Gateway Handshake Error.</td></tr>';
        }
    }
</script>
</body>
</html>
